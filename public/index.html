<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>T3 Lite</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <b>T3 Lite</b>
          <small id="modeLabel">pi · local</small>
        </div>
        <button class="icon" id="closeSidebar" title="关闭">✕</button>
      </div>

      <div class="section">
        <div class="section-head">
          <span>项目</span>
          <button class="mini" id="addProject">+ 项目</button>
        </div>
        <div id="projects" class="projects"></div>
      </div>

      <div class="section grow">
        <div class="section-head">
          <span>线程</span>
          <button class="mini" id="addThread" disabled>+ 线程</button>
        </div>
        <div id="threads" class="threads"></div>
      </div>

      <div class="foot">
        <span id="conn" class="conn">连接中…</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon menu" id="openSidebar">☰</button>
        <div class="title">
          <b id="threadTitle">选择一个线程</b>
          <small id="threadMeta"></small>
        </div>
        <div class="actions">
          <span id="statusDot" class="status-dot idle"></span>
          <span id="statusText" class="status-text">idle</span>
          <button class="ghost" id="diffBtn" disabled>Diff</button>
          <button class="ghost danger" id="abortBtn" disabled>停止</button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="empty">
          <h1>T3 Lite</h1>
          <p>一个给自己用的轻量 agent 控制台。<br />左侧建项目、开线程，然后发第一条消息。</p>
          <p class="hint" id="emptyHint"></p>
        </div>
      </div>

      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="交给 Pi 一个任务…  (Enter 发送，Shift+Enter 换行)" disabled></textarea>
        <button id="send" class="send" disabled>发送</button>
      </form>
    </main>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <b>工作区改动</b>
      <div>
        <button class="ghost" id="copyDiff">复制</button>
        <button class="icon" id="closeDrawer">✕</button>
      </div>
    </div>
    <pre id="diffBody" class="diff"></pre>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
