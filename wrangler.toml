name = "lite-code-relay"
main = "relay-cloudflare/worker.js"
compatibility_date = "2026-11-26"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/daemon", "/client", "/health"]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
